<g filter="url(#shadow)"><rect x="385" y="175" width="270" height="220" rx="20" fill="white"/><rect x="385" y="175" width="270" height="51" rx="20" fill="url(#blue)"/><rect x="385" y="207" width="270" height="19" fill="url(#blue)"/><text x="413" y="208" style="font:700 19px Arial;fill:white">ETL и качество</text><text x="413" y="261" class="t">✓ нормализация категорий</text><text x="413" y="290" class="t">✓ удаление дубликатов</text><text x="413" y="319" class="t">✓ импутация аномалий</text><text x="413" y="348" class="t">✓ ссылочная целостность</text><text x="413" y="377" class="t">✓ журнал 15 проверок</text></g>
