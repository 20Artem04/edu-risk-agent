<rect x="60" y="625" width="1280" height="130" rx="20" fill="#0f203c" stroke="#29436b"/>
<text x="88" y="660" style="font:700 17px Arial;fill:#67e8f9">СКВОЗНЫЕ ГАРАНТИИ</text>
<text x="88" y="697" class="small">Воспроизводимость: seed 42 · сохранённые разбиения · единый pipeline</text>
<text x="497" y="697" class="small">Безопасность: LLM не формирует SQL · ролевой доступ · параметры</text>
<text x="946" y="697" class="small">Этика: синтетические данные · поддержка, не санкции</text>
<text x="88" y="729" class="small">Наблюдаемость: data_quality_log · model_runs · predictions · query_logs</text>
<text x="497" y="729" class="small">Контроль утечки: итоговые оценки только в целевой переменной</text>
<text x="946" y="729" class="small">Развёртывание: локально, без платного API</text>
</svg>