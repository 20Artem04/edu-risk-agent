<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#14254a"/></linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2563eb"/><stop offset="1" stop-color="#06b6d4"/></linearGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-opacity=".22"/></filter>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#67e8f9"/></marker>
  <style>.title{font:700 34px Arial,sans-serif;fill:white}.sub{font:16px Arial,sans-serif;fill:#9fb4d4}.h{font:700 19px Arial,sans-serif;fill:#0f172a}.t{font:14px Arial,sans-serif;fill:#475569}.white{fill:white}.tag{font:700 12px Arial,sans-serif;fill:#0369a1;letter-spacing:1px}.line{stroke:#67e8f9;stroke-width:3;fill:none;marker-end:url(#arrow)}.small{font:13px Arial,sans-serif;fill:#cbd5e1}</style>
</defs>
<rect width="1400" height="820" rx="28" fill="url(#bg)"/>
<text x="60" y="64" class="title">Академический навигатор · архитектура данных</text>
<text x="60" y="94" class="sub">Воспроизводимый контур: три источника → ETL → признаки → модель → инструменты → интерфейс</text>

